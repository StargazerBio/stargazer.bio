<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Stargazer</title>
  <meta name="theme-color" content="#0a0c11">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <script>
    // A browser that has gone on to sign in from here once goes straight to
    // the login app after that. Only the first visit stops to say sign-in is
    // invite-only, which Union's sign-in can't say: it turns an uninvited
    // account away with its own error.
    try {
      if (localStorage.getItem("sign-in-seen")) {
        location.replace("https://login.apps.stargazerbio.us-west-2.unionai.cloud/");
      }
    } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* The landing page's tokens. */
    :root {
      --bg: #0a0c11;
      --surface: #11141b;
      --raised: #191d26;
      --border: rgba(238, 240, 245, 0.08);
      --border-strong: rgba(238, 240, 245, 0.14);
      --heading: #eef0f5;
      --text: #a3a9b8;
      --accent: #b9a0ec;
      --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font: 400 16px/1.5 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    main {
      width: 100%;
      max-width: 448px;
      padding: 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
      font: 500 16px/1 var(--sans);
      color: var(--heading);
      text-decoration: none;
    }
    .brand img { width: auto; height: 32px; image-rendering: pixelated; }
    h1 {
      margin: 0 0 12px;
      font: 500 24px/32px var(--mono);
      letter-spacing: -0.01em;
      color: var(--heading);
    }
    p { margin: 0 0 24px; font-size: 15px; line-height: 24px; }

    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn {
      display: inline-flex;
      align-items: center;
      height: 44px;
      padding: 0 20px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: var(--raised);
      color: var(--heading);
      font: 500 15px/1 var(--sans);
      text-decoration: none;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease), transform 120ms var(--ease);
    }
    .btn:hover { background: #222733; border-color: rgba(238, 240, 245, 0.2); }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--heading); border-color: var(--heading); color: #0e1016; }
    .btn-primary:hover { background: #ffffff; border-color: #ffffff; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/"><img src="../assets/lily.png" alt="" width="959" height="816">Stargazer</a>
    <h1>Log in</h1>
    <p>Stargazer is invite-only while it's in alpha. Sign in with the account
    your invitation was sent to. If you haven't been invited, ask for access
    and we'll get back to you.</p>
    <div class="actions">
      <a class="btn btn-primary" id="continue" href="https://login.apps.stargazerbio.us-west-2.unionai.cloud/">Continue to sign in</a>
      <a class="btn" href="/#request-access">Request access</a>
    </div>
  </main>
  <script>
    document.getElementById("continue").addEventListener("click", () => {
      try { localStorage.setItem("sign-in-seen", "1"); } catch {}
    });
  </script>
</body>
</html>
