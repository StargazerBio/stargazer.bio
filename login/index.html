<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Stargazer</title>
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <script>
    // A browser that has gone on to sign in from here once goes straight to
    // the login app after that. Only the first visit stops to say sign-in is
    // invite-only, which Union's sign-in can't say: it turns an uninvited
    // account away with its own error.
    try {
      if (localStorage.getItem("sign-in-seen")) {
        location.replace("https://login.apps.stargazerbio.us-west-2.unionai.cloud/");
      }
    } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* The landing page's tokens. */
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #2a313c;
      --border-strong: #3b4654;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --heading: #f0f6fc;
      --accent: #b9a0ec;
      --accent-line: rgba(167, 139, 250, 0.42);
      --accent-soft: rgba(167, 139, 250, 0.13);
      --accent-softer: rgba(167, 139, 250, 0.24);
      --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background:
        radial-gradient(60% 50% at 50% 12%, rgba(167, 139, 250, 0.10), transparent 70%),
        radial-gradient(45% 40% at 78% 82%, rgba(134, 199, 108, 0.06), transparent 70%),
        var(--bg);
      color: var(--text);
      font: 400 1.0625rem/1.6 var(--sans);
    }
    a { color: inherit; }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    main {
      width: 100%;
      max-width: 28rem;
      padding: 2rem 1.5rem;
      background: rgba(22, 27, 34, 0.72);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
      font: 600 1.05rem/1 var(--mono);
      letter-spacing: -0.01em;
      color: var(--heading);
      text-decoration: none;
    }
    .brand img { width: auto; height: 32px; }
    h1 {
      margin: 0 0 0.75rem;
      font: 600 1.5rem/1.2 var(--mono);
      letter-spacing: -0.03em;
      color: var(--heading);
    }
    p { margin: 0 0 1.5rem; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      padding: 0.65rem 1.25rem;
      border-radius: 6px;
      border: 1px solid transparent;
      font: 500 0.92rem/1 var(--mono);
      letter-spacing: 0.01em;
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .btn-primary {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent-line);
    }
    .btn-primary:hover { background: var(--accent-softer); border-color: var(--accent); }
    .btn-muted {
      background: transparent;
      color: var(--text);
      border-color: var(--border);
    }
    .btn-muted:hover { background: var(--surface); border-color: var(--border-strong); color: var(--heading); }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/"><img src="../assets/lily.png" alt="" width="959" height="816">Stargazer</a>
    <h1>Log in</h1>
    <p>Stargazer is invite-only while it's in alpha. Sign in with the account
    your invitation was sent to. If you haven't been invited, ask for access
    and we'll get back to you.</p>
    <div class="actions">
      <a class="btn btn-primary" id="continue" href="https://login.apps.stargazerbio.us-west-2.unionai.cloud/">Continue to sign in</a>
      <a class="btn btn-muted" href="mailto:pryce@stargazer.bio?subject=Stargazer%20access">Request access</a>
    </div>
  </main>
  <script>
    document.getElementById("continue").addEventListener("click", () => {
      try { localStorage.setItem("sign-in-seen", "1"); } catch {}
    });
  </script>
</body>
</html>
