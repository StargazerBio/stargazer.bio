<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting… — Stargazer</title>
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <!-- The login app signs the visitor in and sends them to their own dashboard. -->
  <meta http-equiv="refresh" content="0; url=https://login.apps.stargazerbio.us-west-2.unionai.cloud/">
  <link rel="canonical" href="https://login.apps.stargazerbio.us-west-2.unionai.cloud/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(60% 50% at 50% 12%, rgba(167, 139, 250, 0.10), transparent 70%),
        radial-gradient(45% 40% at 78% 82%, rgba(134, 199, 108, 0.06), transparent 70%),
        #0d1117;
      color: #c9d1d9;
      color-scheme: dark;
      font: 500 1rem/1 "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .redirect {
      position: relative;
      display: grid;
      place-items: center;
      width: 11rem;
      height: 11rem;
      color: inherit;
      text-decoration: none;
    }
    /* The dashboard's spinner, drawn as a ring around the words. */
    .redirect::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid #30363d;
      border-top-color: #b9a0ec;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .redirect::before { animation-duration: 2.4s; }
    }
  </style>
</head>
<body>
  <a class="redirect" href="https://login.apps.stargazerbio.us-west-2.unionai.cloud/">Redirecting…</a>
</body>
</html>
